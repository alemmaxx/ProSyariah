name: Harga terkini (waktu pasaran)

on:
  schedule:
    # Isnin–Jumaat, setiap 15 minit dari 9.15 pagi hingga 5.15 petang waktu Malaysia
    - cron: "0,15,30,45 1-9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prosyariah-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q yfinance requests
      - name: Tarik harga terkini
        run: python scripts/live.py
      - name: Simpan
        run: |
          git config user.name "prosyariah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -qm "Harga terkini"
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          fi
