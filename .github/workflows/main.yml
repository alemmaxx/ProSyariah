name: Kemas kini data ProSyariah

on:
  schedule:
    # Setiap hari bekerja 6.30 petang waktu Malaysia (selepas Bursa tutup 5 ptg)
    - cron: "30 10 * * 1-5"
    # Sabtu 10 pagi waktu Malaysia — tangkap senarai SC yang terbit Jumaat terakhir Mei/Nov
    - cron: "0 2 * * 6"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["index.html", "manifest.webmanifest", "sw.js", "icons/**", "data/sc-upload/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prosyariah-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER || 'yfinance' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang keperluan
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Kemas kini senarai simbol KLSE
        run: python scripts/market.py --symbols-only

      - name: Semak senarai patuh syariah SC
        id: sc
        continue-on-error: true
        run: python scripts/sc_list.py

      - name: Simpan log jika bacaan SC gagal
        if: always() && steps.sc.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sc-debug
          path: sc-debug.txt
          if-no-files-found: ignore

      - name: Commit senarai SC & simbol (jika berubah)
        run: |
          git config user.name "prosyariah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sc-list.json data/klse-symbols.json 2>/dev/null || true
          if [ -f sc-debug.txt ]; then cp sc-debug.txt data/sc-debug.txt; git add data/sc-debug.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m "Data: kemas kini senarai SC / simbol KLSE"
            git push
          fi

      - name: Tarik harga & kira indicator
        run: python scripts/market.py --out _site/data

      - name: Commit rekod prestasi isyarat
        run: |
          git add data/signals.json data/paper-live.json data/paper-summary.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Data: rekod prestasi isyarat"
            git pull --rebase -q || true
            git push
          fi

      - name: Sediakan laman
        run: |
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Gagalkan job jika bacaan SC gagal (supaya anda dapat emel)
        if: steps.sc.outcome == 'failure'
        run: |
          echo "::error::Bacaan senarai SC gagal. Data harga tetap dikemas kini; senarai SC lama dikekalkan. Muat turun artifact sc-debug, atau letak PDF senarai SC dalam folder data/sc-upload/."
          exit 1
