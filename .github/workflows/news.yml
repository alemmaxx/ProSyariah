name: Berita terkini (setiap jam waktu pasaran)

on:
  schedule:
    # Waktu Malaysia: setiap jam 9 pagi – 5 petang, kemudian 7, 9, 11 malam
    - cron: "0 1-9 * * *"      # setiap jam 9 pagi – 5 petang MYT (waktu pasaran)
    - cron: "0 11-15/2 * * *"  # 7, 9, 11 malam MYT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prosyariah-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang keperluan
        run: pip install requests google-auth
      - name: Ambil data pasaran terkini dari app
        run: |
          mkdir -p tmp/data
          curl -sSfL "https://prosyariah.web.app/data/market.json" -o tmp/data/market.json \
            || curl -sSfL "https://alemmaxx.github.io/ProSyariah/data/market.json" -o tmp/data/market.json
      - name: Tarik berita
        run: python scripts/news.py --out tmp/data
      - name: Simpan berita
        run: |
          git config user.name "prosyariah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -qm "Data: berita terkini"
            for i in 1 2 3 4; do git pull --rebase -X theirs -q && git push -q && break; sleep $((i*5)); done
          fi
      - name: Notifikasi Berita Berpotensi
        if: env.FIREBASE_SA != ''
        continue-on-error: true
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" python scripts/push.py --out tmp/data --only-news
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Saluran Telegram (Berita Berpotensi)
        if: env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        run: |
          if [ -n "$FIREBASE_SA" ]; then printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"; export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"; fi
          python scripts/telegram.py --out tmp/data --kind news
          rm -f "$RUNNER_TEMP/sa.json"
          git add data/tg-sent.json data/tg-debug.txt 2>/dev/null || true
          git commit -qm "Telegram: rekod mesej" && (git pull --rebase -X theirs -q; git push -q) || true
