plugins { id 'com.android.application' }

android {
    namespace 'com.prokuiz.prosyariah'
    compileSdk 34
    defaultConfig {
        applicationId 'com.prokuiz.prosyariah'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APK_VER') ?: '1')
        versionName "1.0.${System.getenv('APK_VER') ?: '1'}"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'missing.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'prosyariah'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
