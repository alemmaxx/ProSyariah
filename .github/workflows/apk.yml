name: Bina APK Android
# APK penuh (Capacitor): fail app dibungkus dalam APK. Data/harga/isyarat tetap diambil dari internet.
# Bina semula bila app (index.html) atau folder apk/ berubah. Pengguna nampak butang "Kemas kini" dalam app.
on:
  push:
    branches: [main]
    paths: ["index.html", "privacy.html", "icons/**", "apk/**", ".github/workflows/apk.yml", "scripts/apk_key.py", "scripts/apk_firebase.py"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kunci tandatangan & daftar app Android dalam Firebase
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install -q google-auth requests
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          python scripts/apk_key.py "$RUNNER_TEMP/k"
          python scripts/apk_firebase.py "$RUNNER_TEMP/k" "$RUNNER_TEMP/google-services.json"
          rm -f "$RUNNER_TEMP/sa.json"
          git checkout -- .well-known 2>/dev/null || true
      - name: Sediakan fail app
        run: |
          mkdir -p apk/www
          cp -r index.html privacy.html manifest.webmanifest icons apk/www/
          sed -i "s/const APK_BUILD=0;/const APK_BUILD=${{ github.run_number }};/" apk/www/index.html
          grep -q "const APK_BUILD=${{ github.run_number }};" apk/www/index.html
      - name: Projek Android
        working-directory: apk
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx cap add android
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r res/* $RES/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0a1210</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json
          # log masuk Google asli
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          # kebenaran notifikasi & ikon notifikasi push
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_ps"/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ic_launcher_background"/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="prosyariah"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: Bina APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/k/prosyariah.jks" \
            -Pandroid.injected.signing.store.password="$(cat $RUNNER_TEMP/k/pw)" \
            -Pandroid.injected.signing.key.alias=prosyariah \
            -Pandroid.injected.signing.key.password="$(cat $RUNNER_TEMP/k/pw)"
          cp app/build/outputs/apk/release/app-release.apk ../../ProSyariah.apk
          rm -rf "$RUNNER_TEMP/k"
      - name: Terbit ke Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ProSyariah APK v${{ github.run_number }}
          body: "Muat turun ProSyariah.apk di bawah dan pasang di telefon Android."
          files: ProSyariah.apk
          make_latest: true
      - name: Umum versi baharu (butang Kemas kini dalam app) & terbit semula laman
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '{"v": ${{ github.run_number }}}' > data/apk.json
          git add data/apk.json
          git commit -qm "APK v${{ github.run_number }}" && (git pull --rebase -X theirs -q; git push -q) || true
          gh api -X POST repos/${{ github.repository }}/actions/workflows/main.yml/dispatches -f ref=main || true
