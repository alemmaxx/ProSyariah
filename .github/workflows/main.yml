name: Kemas kini data ProSyariah

on:
  schedule:
    # Setiap hari bekerja 6.30 petang waktu Malaysia (selepas Bursa tutup 5 ptg)
    - cron: "30 10 * * 1-5"
    # Sabtu 10 pagi waktu Malaysia — tangkap senarai SC yang terbit Jumaat terakhir Mei/Nov
    - cron: "0 2 * * 6"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["index.html", "manifest.webmanifest", "sw.js", "icons/**", "data/sc-upload/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prosyariah-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER || 'yfinance' }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang keperluan
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Kemas kini senarai simbol KLSE
        run: python scripts/market.py --symbols-only

      - name: Semak senarai patuh syariah SC
        id: sc
        continue-on-error: true
        run: python scripts/sc_list.py

      - name: Simpan log jika bacaan SC gagal
        if: always() && steps.sc.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sc-debug
          path: sc-debug.txt
          if-no-files-found: ignore

      - name: Commit senarai SC & simbol (jika berubah)
        run: |
          git config user.name "prosyariah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sc-list.json data/klse-symbols.json 2>/dev/null || true
          if [ -f sc-debug.txt ]; then cp sc-debug.txt data/sc-debug.txt; git add data/sc-debug.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m "Data: kemas kini senarai SC / simbol KLSE"
            git push
          fi

      - name: Tarik harga & kira indicator
        run: python scripts/market.py --out _site/data

      - name: Commit rekod prestasi isyarat
        run: |
          python3 -c "import json;m=json.load(open('_site/data/market.json'))['meta'];json.dump(m,open('data/market-meta.json','w'),indent=1)" || true
          git add data/signals.json data/paper-live.json data/paper-summary.json data/market-meta.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Data: rekod prestasi isyarat"
            git pull --rebase -q || true
            git push
          fi

      - name: Sediakan laman
        run: |
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # Cermin yang sama ke Firebase Hosting (prosyariah.web.app) — hanya jika secret FIREBASE_SERVICE_ACCOUNT ada
      - name: Cermin ke Firebase (prosyariah.web.app)
        if: env.FIREBASE_SA != ''
        continue-on-error: true
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          python3 -c "import json,os;d=json.load(open(os.environ['RUNNER_TEMP']+'/sa.json'));print('kunci OK:',d.get('type'),d.get('project_id'),d.get('client_email'))" > firebase-debug.txt 2>&1 || echo "kunci JSON tidak sah (salin semua isi fail .json)" > firebase-debug.txt
          PID=$(python3 -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/sa.json')).get('project_id','prosyariah'))")
          echo "project_id dalam kunci: $PID" >> firebase-debug.txt
          # Cipta laman "prosyariah" (prosyariah.web.app) secara automatik jika belum ada
          npx -y firebase-tools@13.29.1 hosting:sites:get prosyariah --project "$PID" --non-interactive >> firebase-debug.txt 2>&1 \
            || npx -y firebase-tools@13.29.1 hosting:sites:create prosyariah --project "$PID" --non-interactive >> firebase-debug.txt 2>&1
          npx -y firebase-tools@13.29.1 deploy --only hosting --project "$PID" --non-interactive --debug --message "Kemas kini $(date -u +%F)" > fb.log 2>&1
          rc=$?
          grep -v -i "private_key\|bearer\|access_token\|refresh_token" fb.log | tail -80 >> firebase-debug.txt
          echo "exit=$rc" >> firebase-debug.txt
          rm -f "$RUNNER_TEMP/sa.json" fb.log
          cp firebase-debug.txt data/firebase-debug.txt
          git add data/firebase-debug.txt
          git commit -qm "Log: deploy Firebase" && (git pull --rebase -q; git push -q) || true
          exit $rc

      - name: Gagalkan job jika bacaan SC gagal (supaya anda dapat emel)
        if: steps.sc.outcome == 'failure'
        run: |
          echo "::error::Bacaan senarai SC gagal. Data harga tetap dikemas kini; senarai SC lama dikekalkan. Muat turun artifact sc-debug, atau letak PDF senarai SC dalam folder data/sc-upload/."
          exit 1
